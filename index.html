<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechPulse | نبض التقنية - بوابة العالم الرقمي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0a0a0a;--panel2:#111;--border:#222;--primary:#0ea5e9;--text:#fff;--muted:#888;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden}

/* Ticker */
.ticker-wrap{width:100%;overflow:hidden;background:var(--primary);color:#fff;padding:6px 0;font-weight:700;font-size:0.85rem}
.ticker{display:inline-block;white-space:nowrap;animation:ticker 30s linear infinite}
.ticker-item{display:inline-block;padding:0 50px}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(100%)}}

/* Header & Navigation */
header{border-bottom:1px solid var(--border);background:rgba(0,0,0,0.95);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.top-bar{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:15px 20px}
.logo{font-size:2.2rem;font-weight:900;display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-icon{width:40px;height:40px;background:var(--primary);border-radius:10px;display:grid;place-items:center;color:#fff;font-size:1.4rem;overflow:hidden}
.logo-icon img{width:100%;height:100%;object-fit:cover}
.search-bar{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 15px;color:#fff;width:300px;outline:none}

/* Categories Strip */
.cat-strip{border-top:1px solid var(--border);background:var(--panel)}
.cat-strip-inner{max-width:1400px;margin:0 auto;display:flex;gap:25px;padding:12px 20px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.cat-strip-inner::-webkit-scrollbar{display:none}
.cat-strip a{color:var(--muted);text-decoration:none;font-weight:700;font-size:0.95rem;cursor:pointer;transition:color .3s}
.cat-strip a:hover,.cat-strip a.active{color:var(--primary)}

/* Main Layout */
.container{max-width:1400px;margin:0 auto;padding:30px 20px}
.grid-main{display:grid;grid-template-columns:3fr 1.2fr;gap:40px}
@media(max-width:1024px){.grid-main{grid-template-columns:1fr}}

/* Hero Section */
.hero-section{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:40px}
.hero-main{cursor:pointer;position:relative;border-radius:16px;overflow:hidden}
.hero-main img{width:100%;height:450px;object-fit:cover;transition:transform .5s}
.hero-main:hover img{transform:scale(1.02)}
.hero-overlay{position:absolute;bottom:0;left:0;right:0;padding:40px;background:linear-gradient(transparent,rgba(0,0,0,0.9))}
.hero-title{font-size:2.5rem;font-weight:900;line-height:1.2;margin-bottom:10px}
.hero-side{display:flex;flex-direction:column;gap:20px}
.side-card{cursor:pointer;position:relative;border-radius:12px;overflow:hidden;flex:1}
.side-card img{width:100%;height:100%;object-fit:cover;min-height:210px}
.side-overlay{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(transparent,rgba(0,0,0,0.9))}
.side-title{font-size:1.2rem;font-weight:800;line-height:1.3}

/* Grid Articles */
.section-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--border);padding-bottom:10px;margin:40px 0 20px}
.section-header h2{font-size:1.5rem;font-weight:900}
.grid-articles{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}
@media(max-width:768px){.grid-articles{grid-template-columns:1fr}}
.card{cursor:pointer;display:flex;flex-direction:column}
.card img{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:15px}
.card-cat{color:var(--primary);font-size:0.8rem;font-weight:800;margin-bottom:5px}
.card-title{font-size:1.1rem;font-weight:800;line-height:1.4;margin-bottom:8px}
.card-meta{font-size:0.8rem;color:var(--muted)}

/* Sidebar Trending */
.trending-list{display:flex;flex-direction:column;gap:20px}
.trend-item{display:flex;gap:15px;cursor:pointer;border-bottom:1px solid var(--border);padding-bottom:15px}
.trend-num{font-size:2rem;font-weight:900;color:var(--border);line-height:1}
.trend-content h4{font-size:1rem;font-weight:700;line-height:1.4}
.trend-content p{font-size:0.8rem;color:var(--muted);margin-top:5px}

/* Reader */
.reader{max-width:900px;margin:0 auto;padding:60px 20px;animation:fadeIn .5s}
.reader h1{font-size:3rem;font-weight:900;line-height:1.2;margin-bottom:20px}
.reader-img{width:100%;border-radius:16px;margin:30px 0;max-height:500px;object-fit:cover}
.reader-body{font-size:1.2rem;line-height:2;color:#ccc}
.reader-body p{margin-bottom:25px}

/* Footer */
footer{background:var(--panel2);border-top:1px solid var(--border);padding:60px 20px;margin-top:80px}
.footer-grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr;text-align:center}}
.footer-col h4{font-size:1.2rem;font-weight:800;margin-bottom:20px}
.footer-col ul{list-style:none}
.footer-col ul li{margin-bottom:12px}
.footer-col ul li a{color:var(--muted);text-decoration:none;cursor:pointer}
.footer-col ul li a:hover{color:var(--primary)}
.footer-bottom{max-width:1400px;margin:40px auto 0;padding-top:20px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:0.9rem}
</style>
</head>
<body>

<div class="ticker-wrap" id="ticker-wrap">
  <div class="ticker" id="ticker"></div>
</div>

<header>
  <div class="top-bar">
    <div class="logo" onclick="showHome()">
      <div class="logo-icon" id="nav-logo">T</div>
      <span id="nav-name">نبض التقنية</span>
    </div>
    <input type="text" class="search-bar" placeholder="ابحث عن خبر... (قريباً)">
  </div>
  <div class="cat-strip">
    <div class="cat-strip-inner" id="nav-categories">
      <a onclick="showHome()" class="active">الرئيسية</a>
    </div>
  </div>
</header>

<div id="main-content"></div>

<footer>
  <div class="footer-grid">
    <div class="footer-col">
      <h4 id="footer-name">نبض التقنية</h4>
      <p id="footer-desc" style="color:var(--muted)">منصتك العربية الأولى لاكتشاف أحدث الابتكارات.</p>
    </div>
    <div class="footer-col">
      <h4>الأقسام</h4>
      <ul id="footer-cats"></ul>
    </div>
    <div class="footer-col">
      <h4>روابط سريعة</h4>
      <ul>
        <li><a onclick="showPage('about')">من نحن</a></li>
        <li><a onclick="showPage('contact')">اتصل بنا</a></li>
        <li><a href="#">سياسة الخصوصية</a></li>
      </ul>
    </div>
    <div class="footer-col">
      <h4>تابعنا</h4>
      <ul id="footer-socials"></ul>
    </div>
  </div>
  <div class="footer-bottom" id="footer-copy">© 2024 نبض التقنية.</div>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA5uOFpkKHTCqLwRnR0Uz9x7TQJeETqK8I", authDomain: "injaz-platform-c3dfc.firebaseapp.com", projectId: "injaz-platform-c3dfc", storageBucket: "injaz-platform-c3dfc.firebasestorage.app", messagingSenderId: "564548592525", appId: "1:564548592525:web:cb5c5bd0258f7126a553c4" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

let articles = [], categories = [], settings = {};
const mainContent = document.getElementById('main-content');

async function init() {
  onSnapshot(doc(db, "settings", "site"), (docSnap) => {
    if (docSnap.exists()) {
      settings = docSnap.data();
      applySettings();
    }
  });

  const catSnap = await getDocs(collection(db, "categories"));
  categories = catSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderNavAndFooter();

  const artSnap = await getDocs(query(collection(db, "articles"), orderBy("date", "desc")));
  articles = artSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  
  showHome();
}

function applySettings() {
  if(settings.siteName) {
    document.getElementById('nav-name').textContent = settings.siteName;
    document.getElementById('footer-name').textContent = settings.siteName;
    document.title = settings.siteName;
  }
  if(settings.logo && settings.logo.startsWith('data:image')) {
    document.getElementById('nav-logo').innerHTML = `<img src="${settings.logo}">`;
  } else {
    document.getElementById('nav-logo').textContent = settings.logo || 'T';
  }
  if(settings.footerDesc) document.getElementById('footer-desc').textContent = settings.footerDesc;
  if(settings.copyright) document.getElementById('footer-copy').textContent = settings.copyright;
  
  if(settings.tickerText && settings.tickerText.trim() !== '') {
    document.getElementById('ticker-wrap').style.display = 'block';
    document.getElementById('ticker').innerHTML = `<span class="ticker-item">⚡ ${settings.tickerText}</span>`;
  } else {
    document.getElementById('ticker-wrap').style.display = 'none';
  }

  const socialsEl = document.getElementById('footer-socials');
  socialsEl.innerHTML = '';
  if(settings.socials) {
    settings.socials.forEach(s => {
      socialsEl.innerHTML += `<li><a href="${s.url}" target="_blank">${s.name}</a></li>`;
    });
  }
}

function renderNavAndFooter() {
  const nav = document.getElementById('nav-categories');
  const footerCats = document.getElementById('footer-cats');
  let navHtml = `<a onclick="showHome()" class="active">الرئيسية</a>`;
  let footHtml = '';
  categories.forEach(c => {
    navHtml += `<a onclick="filterCategory('${c.name}')">${c.name}</a>`;
    footHtml += `<li><a onclick="filterCategory('${c.name}')">${c.name}</a></li>`;
  });
  nav.innerHTML = navHtml;
  footerCats.innerHTML = footHtml;
}

function showHome() {
  document.querySelectorAll('.cat-strip a').forEach(a => a.classList.remove('active'));
  document.querySelector('.cat-strip a')?.classList.add('active');
  
  if(articles.length === 0) {
    mainContent.innerHTML = `<div class="container"><h2 style="text-align:center;padding:100px;color:var(--muted)">لا توجد أخبار حالياً.</h2></div>`;
    return;
  }

  const main = articles[0];
  const side = articles.slice(1, 3);
  const latest = articles.slice(3, 9);
  const trending = articles.slice(0, 5);

  mainContent.innerHTML = `
    <div class="container">
      <div class="grid-main">
        <div>
          <!-- Hero -->
          <div class="hero-section">
            <div class="hero-main" onclick="openArticle('${main.id}')">
              <img src="${main.image || ''}">
              <div class="hero-overlay">
                <span class="card-cat">${main.category}</span>
                <h1 class="hero-title">${main.title}</h1>
              </div>
            </div>
            <div class="hero-side">
              ${side.map(a => `
                <div class="side-card" onclick="openArticle('${a.id}')">
                  <img src="${a.image || ''}">
                  <div class="side-overlay">
                    <span class="card-cat">${a.category}</span>
                    <h2 class="side-title">${a.title}</h2>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Latest -->
          <div class="section-header">
            <h2>أحدث الأخبار</h2>
          </div>
          <div class="grid-articles">
            ${latest.map(a => `
              <div class="card" onclick="openArticle('${a.id}')">
                <img src="${a.image || ''}">
                <span class="card-cat">${a.category}</span>
                <h3 class="card-title">${a.title}</h3>
                <div class="card-meta">📅 ${new Date(a.date).toLocaleDateString('ar-DZ')}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Sidebar -->
        <div>
          <div class="section-header">
            <h2>الأكثر قراءة</h2>
          </div>
          <div class="trending-list">
            ${trending.map((a, i) => `
              <div class="trend-item" onclick="openArticle('${a.id}')">
                <div class="trend-num">0${i+1}</div>
                <div class="trend-content">
                  <h4>${a.title}</h4>
                  <p>${a.category}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

function filterCategory(catName) {
  document.querySelectorAll('.cat-strip a').forEach(a => a.classList.remove('active'));
  const filtered = articles.filter(a => a.category === catName);
  
  mainContent.innerHTML = `
    <div class="container">
      <div class="section-header"><h2>قسم: ${catName}</h2></div>
      <div class="grid-articles">
        ${filtered.map(a => `
          <div class="card" onclick="openArticle('${a.id}')">
            <img src="${a.image || ''}">
            <span class="card-cat">${a.category}</span>
            <h3 class="card-title">${a.title}</h3>
            <div class="card-meta">📅 ${new Date(a.date).toLocaleDateString('ar-DZ')}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

function openArticle(id) {
  const article = articles.find(a => a.id === id);
  if(!article) return;

  mainContent.innerHTML = `
    <div class="reader">
      <span class="card-cat">${article.category}</span>
      <h1>${article.title}</h1>
      <div class="card-meta" style="font-size:1rem;margin-bottom:20px">✍️ ${article.author} • 📅 ${new Date(article.date).toLocaleDateString('ar-DZ')}</div>
      ${article.image ? `<img src="${article.image}" class="reader-img">` : ''}
      <div class="reader-body">
        ${article.content.split('\n').map(p => `<p>${p}</p>`).join('')}
      </div>
      <div style="margin-top:50px;text-align:center">
        <button onclick="showHome()" style="background:var(--primary);color:#fff;padding:15px 30px;border-radius:12px;border:none;cursor:pointer;font-weight:bold">← العودة للرئيسية</button>
      </div>
    </div>
  `;
  window.scrollTo(0,0);
}

function showPage(page) {
  if(page === 'contact') {
    mainContent.innerHTML = `
      <div class="container" style="max-width:800px;padding:80px 20px">
        <div class="section-header"><h2>اتصل بنا</h2></div>
        <div style="background:var(--panel2);padding:40px;border-radius:24px">
          <div style="display:flex;flex-direction:column;gap:20px">
            <input type="text" placeholder="الاسم" style="padding:15px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:#fff">
            <input type="email" placeholder="البريد الإلكتروني" style="padding:15px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:#fff">
            <textarea placeholder="رسالتك..." style="padding:15px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:#fff;height:150px"></textarea>
            <button style="padding:15px;border-radius:12px;background:var(--primary);color:#fff;border:none;font-weight:bold">إرسال</button>
          </div>
        </div>
      </div>
    `;
  }
  if(page === 'about') {
    mainContent.innerHTML = `
      <div class="container" style="max-width:800px;padding:80px 20px">
        <div class="section-header"><h2>من نحن</h2></div>
        <p style="color:var(--muted);font-size:1.2rem;line-height:2;text-align:center">${settings.aboutText || 'منصة تقنية.'}</p>
      </div>
    `;
  }
  window.scrollTo(0,0);
}

window.showHome = showHome;
window.filterCategory = filterCategory;
window.openArticle = openArticle;
window.showPage = showPage;

init();
</script>
</body>
</html>
