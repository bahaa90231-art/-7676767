/* ============ الألوان ============ */
:root{
  --board:#16332c; --board-2:#0e241f; --board-3:#123029;
  --panel:#1c4038; --panel-2:#235046; --line:rgba(245,242,232,.14);
  --chalk:#f5f2e8; --dim:#adc0b5; --dim-2:#7f9a8d;
  --yellow:#f2c14e; --yellow-ink:#3a2c07;
  --blue:#9fd3db; --rose:#e8938a; --green:#8fd6a8;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --f-display:'Changa','Tajawal',sans-serif;
  --f-body:'Tajawal','Changa',sans-serif;
  --sh:0 10px 30px rgba(4,14,11,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--f-body); color:var(--chalk); background:var(--board-2);
  min-height:100vh; min-height:100dvh; line-height:1.75; font-size:16px;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
/* سبورة: ملمس طباشيري */
.board-bg{position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(242,193,78,.07), transparent 60%),
    radial-gradient(900px 600px at 10% 110%, rgba(159,211,219,.06), transparent 55%),
    radial-gradient(500px 350px at 60% 45%, rgba(255,255,255,.025), transparent 70%),
    linear-gradient(160deg, var(--board) 0%, var(--board-2) 55%, #0a1c17 100%);
}
.board-bg::after{content:'';position:absolute;inset:0;opacity:.5;
  background-image:
    radial-gradient(rgba(255,255,255,.028) 1px, transparent 1.4px),
    radial-gradient(rgba(255,255,255,.02) 1px, transparent 1.4px);
  background-size:7px 7px, 11px 11px; background-position:0 0, 3px 5px;}
::selection{background:rgba(242,193,78,.35)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px;border-radius:6px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--blue)}

/* ============ مكونات عامة ============ */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;
  border:none;border-radius:var(--r-sm);padding:11px 20px;font-size:15px;font-weight:700;
  background:var(--yellow);color:var(--yellow-ink);transition:transform .15s,filter .15s,box-shadow .15s;
  box-shadow:0 4px 14px rgba(242,193,78,.22)}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--chalk);border:1.5px dashed rgba(245,242,232,.35);box-shadow:none}
.btn.ghost:hover{border-color:var(--yellow);color:var(--yellow)}
.btn.danger{background:transparent;color:var(--rose);border:1.5px solid rgba(232,147,138,.4);box-shadow:none}
.btn.danger:hover{background:rgba(232,147,138,.12)}
.btn.blue{background:var(--blue);color:#123b40;box-shadow:0 4px 14px rgba(159,211,219,.2)}
.btn svg{width:17px;height:17px;flex:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.field label{font-size:13.5px;font-weight:700;color:var(--dim)}
.field input,.field select,.field textarea{
  background:rgba(10,26,21,.55);border:1.5px solid var(--line);border-radius:var(--r-sm);
  color:var(--chalk);padding:11px 14px;font-size:15px;transition:border-color .15s;width:100%}
.field textarea{resize:vertical;min-height:90px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--yellow);outline:none}
.field input::placeholder,.field textarea::placeholder{color:var(--dim-2)}
.field select option{background:var(--board-2)}
.hint{font-size:12.5px;color:var(--dim-2)}
.card{background:linear-gradient(180deg,var(--panel) 0%, rgba(28,64,56,.75) 100%);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:4px 11px;border-radius:99px;border:1px solid}
.tag.t-wajeb{color:var(--yellow);border-color:rgba(242,193,78,.45);background:rgba(242,193,78,.08)}
.tag.t-tadhkir{color:var(--blue);border-color:rgba(159,211,219,.45);background:rgba(159,211,219,.08)}
.tag.t-mlf{color:var(--green);border-color:rgba(143,214,168,.45);background:rgba(143,214,168,.08)}
.tag.t-elem{color:var(--rose);border-color:rgba(232,147,138,.5);background:rgba(232,147,138,.08)}
.tag.t-all{color:var(--dim);border-color:var(--line);background:rgba(245,242,232,.05)}

/* ============ بوابة الدخول ============ */
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:28px 20px;gap:34px}
.gate-brand{text-align:center;animation:rise .7s ease both}
.gate-logo{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;position:relative;
  background:linear-gradient(145deg,var(--panel-2),var(--panel));border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.gate-logo svg{width:44px;height:44px}
.gate-title{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,8vw,58px);line-height:1.25}
.gate-sub{color:var(--dim);font-size:clamp(15px,3.5vw,18px);margin-top:2px}
.gate-sub b{color:var(--yellow);font-weight:700}
.chalk-line{display:block;margin:10px auto 0;width:min(340px,70vw)}
.chalk-line path{stroke:var(--yellow);stroke-width:5;fill:none;stroke-linecap:round;
  stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s .35s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.gate-cards{display:grid;grid-template-columns:repeat(2,minmax(240px,300px));gap:22px;width:100%;max-width:680px}
@media(max-width:640px){.gate-cards{grid-template-columns:1fr;max-width:360px}}
.gate-card{text-align:right;background:linear-gradient(180deg,var(--panel) 0%, rgba(28,64,56,.72) 100%);
  border:1.5px dashed rgba(245,242,232,.28);border-radius:var(--r-lg);padding:26px 24px;cursor:pointer;
  transition:border-color .2s,transform .2s,box-shadow .2s;animation:rise .7s .15s ease both}
.gate-card:nth-child(2){animation-delay:.28s}
.gate-card:hover{border-color:var(--yellow);border-style:solid;transform:translateY(-4px);box-shadow:var(--sh)}
.gate-card .ic{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.gate-card .ic svg{width:26px;height:26px}
.gate-card.a .ic{background:rgba(242,193,78,.13);color:var(--yellow)}
.gate-card.b .ic{background:rgba(159,211,219,.13);color:var(--blue)}
.gate-card h3{font-family:var(--f-display);font-weight:700;font-size:21px;margin-bottom:4px}
.gate-card p{color:var(--dim);font-size:14px}
.gate-card .go{margin-top:14px;color:var(--yellow);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.gate-foot{color:var(--dim-2);font-size:12.5px;text-align:center}
.foot-link{background:none;border:1.5px dashed rgba(245,242,232,.3);border-radius:99px;color:var(--blue);
  font-family:inherit;font-size:13px;font-weight:700;padding:8px 20px;cursor:pointer;transition:border-color .15s;display:inline-flex;align-items:center;gap:7px;margin-bottom:8px}
.foot-link:hover{border-color:var(--blue)}

/* ============ نافذة دخول ============ */
.overlay{position:fixed;inset:0;background:rgba(6,17,14,.7);backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--board-3);border:1px solid var(--line);border-radius:var(--r-lg);
  width:100%;max-width:420px;padding:26px;box-shadow:var(--sh);animation:pop .25s ease;max-height:92vh;overflow:auto}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{font-family:var(--f-display);font-weight:700;font-size:21px;margin-bottom:4px}
.modal .sub{color:var(--dim);font-size:13.5px;margin-bottom:18px}
.modal-x{position:sticky;top:0;float:left;margin:-8px -8px 0 0;background:none;border:none;color:var(--dim);padding:6px;border-radius:8px}
.modal-x:hover{color:var(--chalk);background:rgba(255,255,255,.06)}
.modal-x svg{width:20px;height:20px}

/* ============ الشريط العلوي ============ */
.topbar{position:sticky;top:0;z-index:40;background:rgba(14,36,31,.82);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--panel-2),var(--panel));
  border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.brand .logo svg{width:23px;height:23px}
.brand .t1{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.3}

const DB_KEY = 'risala_school_v1';
let DB = lsGet(DB_KEY, null);
if(!DB) DB = {students:[], posts:[], notifs:[], pass:'', seq:0};
const save = () => lsSet(DB_KEY, DB);

/* ================= أدوات ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* توحيد شكل الاسم للمقارنة: بلا تشكيل، وألف/همزات متساوية، وتاء مربوطة و ألف مقصورة */
const norm = s => String(s??'').replace(/[\u064B-\u0652\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
const TYPES = {wajeb:{n:'واجب',c:'t-wajeb'}, tadhkir:{n:'تذكير',c:'t-tadhkir'}, mlf:{n:'ملف',c:'t-mlf'}, elem:{n:'علامة',c:'t-elem'}};
function fmtTime(ts){
  const d = new Date(ts), now = new Date(), diff = (now-d)/1000;
  if(diff < 60) return 'الآن';
  if(diff < 3600) return `قبل ${Math.floor(diff/60)} دقيقة`;
  if(diff < 86400 && d.getDate()===now.getDate()) return `اليوم ${d.toLocaleTimeString('ar-SY',{hour:'2-digit',minute:'2-digit'})}`;
  return d.toLocaleDateString('ar-SY',{day:'numeric',month:'long'}) + ' - ' + d.toLocaleTimeString('ar-SY',{hour:'2-digit',minute:'2-digit'});
}
function toast(msg, kind='ok'){
  const t = document.createElement('div');
  t.className = 'toast' + (kind==='err'?' err':kind==='info'?' info':'');
  t.innerHTML = `<svg><use href="#i-${kind==='err'?'warn':kind==='info'?'bell':'check'}"/></svg><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3200);
}
function modal(html){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="overlay"><div class="modal">${html}</div></div>`;
  root.querySelector('.overlay').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal(); });
  return root;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }

/* ================= الجلسة ================= */
let session = lsGet('risala_session_student', null); // {id}
function showGate(){
  session = null; lsSet('risala_session_student', null);
  $('#viewGate').style.display='flex'; $('#viewStudent').style.display='none';
}
function showStudent(){
  const s = DB.students.find(x=>x.id===session.id);
  if(!s){ showGate(); return; }
  $('#viewGate').style.display='none'; $('#viewStudent').style.display='block';
  $('#chipStu').innerHTML = `<div class="av">${esc(s.name.trim()[0])}</div><div><div class="nm">${esc(s.name)}</div><div class="rl">رقم الطالب: ${esc(s.id)}${s.branch?` - فرع ${esc(s.branch)}`:''}</div></div>`;
  S.filter = 'all'; renderStudent(); updateBell();
}

/* ================= دخول الطالب ================= */
function askStudent(){
  modal(`
    <button class="modal-x" onclick="closeModal()"><svg><use href="#i-x"/></svg></button>
    <h3>بوابة الطالب</h3><p class="sub">أدخل رقم الطالب واسمك كما سجّله المشرف</p>
    <div class="field"><label>رقم الطالب</label><input id="mSid" inputmode="numeric" placeholder="مثال: 26001"></div>
    <div class="field"><label>اسم الطالب</label><input id="mName" placeholder="الاسم الكامل المسجل"></div>
    <button class="btn blue" style="width:100%" id="mGo">دخول</button>`);
  const go = ()=>{
    const sid = $('#mSid').value.trim();
    const s = DB.students.find(x=>x.id===sid);
    if(!s) return toast('لا يوجد طالب بهذا الرقم','err');
    if(norm(s.name) !== norm($('#mName').value)) return toast('الاسم غير مطابق لرقم الطالب','err');
    closeModal(); session={role:'student', id:s.id}; lsSet('risala_session_student',session); showStudent();
  };
  $('#mGo').onclick = go;
  $('#mSid').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#mName').focus(); });
  $('#mName').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  $('#mSid').focus();
}
$('#cardStudent').onclick = askStudent;
$('#cardStudent').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') askStudent(); });
$('#btnLogoutS').onclick = showGate;

/* ================= مزامنة البيانات ================= */
$('#btnSync').onclick = ()=>{
  modal(`
    <button class="modal-x" onclick="closeModal()"><svg><use href="#i-x"/></svg></button>
    <h3>مزامنة البيانات</h3>
    <p class="sub">إذا أرسل لك المشرف ملف «بيانات-مدرسة-الرسالة.json» فاختره هنا لتظهر الطلاب والإرسالات والإشعارات على هذا الجهاز.</p>
    <button class="btn blue" style="width:100%" id="mSync"><svg width="16" height="16"><use href="#i-up"/></svg>اختيار ملف البيانات</button>
    <input type="file" id="mSyncFile" accept=".json,application/json" style="display:none">`);
  $('#mSync').onclick = ()=>$('#mSyncFile').click();
  $('#mSyncFile').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(!d || !Array.isArray(d.students)) throw 0;
        DB = {students:d.students||[], posts:d.posts||[], notifs:d.notifs||[], pass:'', seq:d.seq||0};
        save(); closeModal();
        toast('تمت المزامنة! يمكنك الآن تسجيل الدخول برقمك');
      }catch(err){ toast('الملف غير صالح','err'); }
    };
    r.readAsText(f);
  };
};

/* ================= منشورات الطالب ================= */
const S = { filter:'all' };
$('#tabsS').addEventListener('click', e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  S.filter = b.dataset.f;
  document.querySelectorAll('#tabsS .tab').forEach(t=>t.classList.toggle('on', t===b));
  renderStudent();
});
function myPosts(){
  const s = DB.students.find(x=>x.id===session.id); if(!s) return [];
  return DB.posts.filter(p=>{
    if(p.target.mode==='all') return true;
    if(p.target.mode==='class'){
      if(p.target.cls!==s.cls || p.target.sec!==s.sec) return false;
      return !p.target.branch || p.target.branch==='all' || p.target.branch===s.branch;
    }
    return p.target.sid===s.id;
  }).sort((a,b)=>b.ts-a.ts);
}
function isUnread(p){ return p._unread === true; }
function postHTML(p){
  const t = TYPES[p.type];
  let target = '';
  if(p.target.mode==='class') target = `<span class="pill-meta"><svg width="12" height="12"><use href="#i-target"/></svg>الصف ${esc(p.target.cls)} - شعبة ${esc(p.target.sec)}${p.target.branch && p.target.branch!=='all'?` - فرع ${esc(p.target.branch)}`:''}</span>`;
  let body = '';
  if(p.type==='elem'){
    body = `<div class="pill-meta"><svg width="12" height="12"><use href="#i-book"/></svg>${esc(p.subject)} - ${esc(p.exam)}</div>
      <div class="body">${esc(p.text||'')}</div>
      <div class="grade-big"><span class="g">${esc(p.grade)}</span><span class="of">/ ${esc(p.max)}</span></div>`;
  } else {
    body = p.text ? `<div class="body">${esc(p.text)}</div>` : '';
  }
  let file = '';
  if(p.file){
    const isLink = p.file.data.startsWith('http');
    file = `<div class="file-att"><svg><use href="#i-file"/></svg><span class="fn">${esc(p.file.name)}</span>
      ${isLink ? `<a href="${esc(p.file.data)}" target="_blank" rel="noopener">فتح الرابط</a>`
               : `<button class="dl" onclick="downloadFile('${p.pid}')"><svg width="14" height="14"><use href="#i-dl"/></svg>تنزيل</button>`}
      </div>`;
  }
  return `<article class="post ${isUnread(p)?'unread':''}" id="post-${p.pid}">
    <div class="post-h"><span class="tag ${t.c}">${t.n}</span>${target}<span class="tm">${fmtTime(p.ts)}</span></div>
    <h4>${esc(p.title)}</h4>${body}${file}</article>`;
}
function renderStudent(){
  let posts = myPosts();
  if(S.filter!=='all') posts = posts.filter(p=>p.type===S.filter);
  const names = {all:'كل الإرسالات', wajeb:'الواجبات', tadhkir:'التذكيرات', mlf:'الملفات', elem:'العلامات'};
  $('#stuFeed').innerHTML = `
    <h2 class="page-title">${names[S.filter]}</h2>
    <p class="page-sub">ما يصل لك هنا جاء من مشرف مدرستك مباشرة</p>
    ${posts.length ? posts.map(p=>postHTML(p)).join('') :
      `<div class="card empty"><svg><use href="#i-bell"/></svg><p>لا يوجد شيء في هذا القسم بعد. سنخبرك فور وصول أي جديد.</p></div>`}`;
}
window.downloadFile = pid=>{
  const p = DB.posts.find(x=>x.pid===pid); if(!p||!p.file) return;
  const a = document.createElement('a');
  a.href = p.file.data; a.download = p.file.name;
  document.body.appendChild(a); a.click(); a.remove();
};
/* الإشعارات غير المقروءة: نعلّمها مؤقتًا عند العرض، وتُحفظ كمقروءة بعد ثوان */
const UNREAD = {};
DB.notifs.forEach(n=>{ if(n.sid===session?.id && !n.read) UNREAD[n.pid] = true; });
function applyUnread(){ myPosts().forEach(p=>{ p._unread = !!UNREAD[p.pid]; }); }
const _rs = renderStudent;
renderStudent = function(){ applyUnread(); _rs(); };

/* ================= الجرس ================= */
function updateBell(){
  const unread = Object.keys(UNREAD).length;
  const b = $('#bellBadge');
  if(unread){ b.style.display='flex'; b.textContent = unread; }
  else b.style.display='none';
  const list = $('#notifList');
  const items = DB.notifs.filter(n=>n.sid===session?.id).sort((a,b)=>b.ts-a.ts).slice(0,30);
  list.innerHTML = items.length ? items.map(n=>{
    const p = DB.posts.find(x=>x.pid===n.pid);
    if(!p) return '';
    return `<div class="notif-item ${UNREAD[n.pid]?'unread':''}" data-pid="${p.pid}">
      <span class="dot"></span>
      <div><div class="t">${esc(p.title)}</div>
      <div class="s">${TYPES[p.type].n}${p.file && !p.file.data.startsWith('http')?' مع ملف':''} - ${fmtTime(n.ts)}</div></div></div>`;
  }).join('') : `<div class="empty" style="padding:24px"><p>لا إشعارات بعد</p></div>`;
}
$('#btnBell').onclick = ()=>{ updateBell(); $('#notifPanel').classList.add('open'); };
$('#notifBg').onclick = ()=> $('#notifPanel').classList.remove('open');
$('#markAll').onclick = ()=>{
  Object.keys(UNREAD).forEach(k=>delete UNREAD[k]);
  DB.notifs.forEach(n=>{ if(n.sid===session?.id) n.read=true; });
  save(); updateBell();
  document.querySelectorAll('#stuFeed .post.unread').forEach(p=>p.classList.remove('unread'));
};
$('#notifList').addEventListener('click', e=>{
  const it = e.target.closest('.notif-item'); if(!it) return;
  $('#notifPanel').classList.remove('open');
  const pid = it.dataset.pid;
  const p = DB.posts.find(x=>x.pid===pid);
  if(!p) return;
  S.filter = p.type;
  document.querySelectorAll('#tabsS .tab').forEach(t=>t.classList.toggle('on', t.dataset.f===S.filter));
  renderStudent(); updateBell();
  const el = document.getElementById('post-'+pid);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
});
/* فتح منشور غير مقروء يعلمه كمقروء */
document.addEventListener('click', e=>{
  const post = e.target.closest('.post.unread');
  if(post && post.id.startsWith('post-p')){
    const pid = post.id.slice(5);
    if(UNREAD[pid]){
      delete UNREAD[pid];
      DB.notifs.forEach(n=>{ if(n.sid===session?.id && n.pid===pid) n.read=true; });
      save(); post.classList.remove('unread'); updateBell();
    }
  }
}, true);

/* ================= الإقلاع ================= */
if(session && session.id && DB.students.some(s=>s.id===session.id)) showStudent();
else showGate();
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
</script>
</body>
</html>
